plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.quickwadb'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.quickwadb"
        minSdk 30
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
